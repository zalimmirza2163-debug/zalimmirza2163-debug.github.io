<style>
:root{color-scheme:light dark;--bg:light-dark(#efeae4,#0f0e0d);--app:light-dark(#fff,#18171a);--ink:light-dark(#141316,#f4f2ef);--mut:light-dark(#77737a,#a29da4);--line:light-dark(#ece9ee,#2a282d);--soft:light-dark(#f6f4f7,#222025);--acc:#ff4b1f;--accs:light-dark(#fff0eb,#3a1f17);--ok:#16a34a;--oks:light-dark(#e9f8ef,#14301f);--no:#e11d48;--nos:light-dark(#fff0f3,#3a1520)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;display:flex;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:440px;background:var(--app);min-height:100vh;display:flex;flex-direction:column;position:relative}
@media(min-width:600px){body{padding:28px 0}.phone{min-height:880px;border-radius:44px;border:10px solid #141316;box-shadow:0 30px 80px -20px #0006;overflow:hidden}}
header{display:flex;align-items:center;gap:10px;padding:18px 20px 6px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--acc);display:grid;place-items:center;border:0;cursor:pointer;padding:0}
.brand{font-weight:800;font-size:15px}
.back,.sm{border:0;background:var(--soft);color:var(--ink);border-radius:12px;min-height:38px;padding:0 12px;font:700 14px Manrope,sans-serif;cursor:pointer}
.back{margin-inline-start:auto}.back[hidden]+.bell{margin-inline-start:auto}
main{flex:1;padding:14px 20px 24px;display:flex;flex-direction:column;gap:14px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){main{animation:none}}
.kick{font-size:13px;color:var(--acc);font-weight:700}
h1{font-size:30px;line-height:1.08;margin:0;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:18px;margin:8px 0 -4px}
.sub{color:var(--mut);font-size:14px;margin:-6px 0 0}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--mut);height:40px;border-radius:10px;font:700 14px Manrope,sans-serif;cursor:pointer}
.seg button.on{background:var(--app);color:var(--ink);box-shadow:0 1px 4px #0002}
.person{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:16px}
.av{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px}
.pi{flex:1;display:flex;flex-direction:column}
.pi input{border:0;background:none;color:var(--ink);font:700 16px Manrope,sans-serif;padding:2px 0;width:100%}
.pi button{border:0;background:none;padding:2px 0;text-align:start;color:var(--acc);font:700 13px Manrope,sans-serif;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pi button.set{color:var(--mut)}
.x{border:0;background:none;color:var(--mut);font-size:22px;width:36px;height:44px;cursor:pointer}
.add{border:1.5px dashed var(--line);background:none;color:var(--mut);border-radius:16px;height:52px;font:700 15px Manrope,sans-serif;cursor:pointer}
.f{display:flex;gap:10px}.f label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:600}
.f input,.srch input{border:1px solid var(--line);background:var(--soft);color:var(--ink);font:600 16px Manrope,sans-serif;border-radius:12px;height:46px;padding:0 12px;width:100%}
.srch{display:flex;gap:8px}.srch .sm{flex:none;min-height:46px}
.cta{border:0;background:var(--acc);color:#fff;min-height:54px;border-radius:16px;font:800 16px Manrope,sans-serif;cursor:pointer;box-shadow:0 8px 20px -8px var(--acc);width:100%;display:grid;place-items:center;text-decoration:none;padding:0 16px}
.cta:disabled{opacity:.4;box-shadow:none;cursor:default}
.cta.dark{background:var(--ink);color:var(--app);box-shadow:none}
.ghost{border:1.5px solid var(--line);background:var(--app);color:var(--ink);min-height:50px;border-radius:16px;font:800 15px Manrope,sans-serif;cursor:pointer;display:grid;place-items:center;text-decoration:none;padding:0 12px;text-align:center}
.end{margin-top:auto;display:flex;flex-direction:column;gap:10px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.map{border-radius:22px;overflow:hidden;height:300px;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center;color:var(--mut);font-size:14px}
.map.tall{height:340px}
.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 13px Manrope,sans-serif;border:3px solid #fff;box-shadow:0 2px 8px #0005}
.pin.big{width:38px;height:38px;background:var(--acc);font-size:16px}
.res{border:1px solid var(--line);border-radius:18px;padding:14px}
.tl{font-size:12px;font-weight:800;color:var(--acc)}
.times{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.times span{background:var(--soft);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--app);color:var(--ink);border-radius:999px;min-height:40px;padding:0 14px;font:700 14px Manrope,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--app);border-color:var(--ink)}
.lab{font-weight:800;font-size:15px;margin-bottom:-4px}
.bud{display:flex;justify-content:space-between;align-items:baseline}.bud strong{color:var(--acc);white-space:nowrap}
.rng{position:relative;height:36px}
.rng input{position:absolute;inset:0;width:100%;pointer-events:none;-webkit-appearance:none;appearance:none;background:none;margin:0}
.rng input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--app);border:3px solid var(--acc);cursor:pointer}
.rng input::-moz-range-thumb{pointer-events:auto;width:22px;height:22px;border-radius:50%;background:var(--app);border:3px solid var(--acc);cursor:pointer}
.track{position:absolute;left:13px;right:13px;top:16px;height:4px;border-radius:2px;background:var(--line)}.track i{position:absolute;top:0;bottom:0;background:var(--acc);border-radius:2px}
.note{background:var(--accs);border-radius:14px;padding:10px 12px;font-size:14px}
.plan{text-align:start;width:100%;border:1.5px solid var(--line);background:var(--app);color:var(--ink);border-radius:20px;padding:14px;cursor:pointer;font-family:inherit}
.plan.top{border-color:var(--acc);box-shadow:0 6px 24px -12px var(--acc)}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tag{font-size:12px;font-weight:800;color:var(--acc)}
.price{font-weight:800;white-space:nowrap}.price small{color:var(--mut);font-weight:600}
.plan h3{margin:4px 0 6px;font-size:19px;line-height:1.15}
.plan ul{margin:0;padding:0;list-style:none;font-size:14px;color:var(--mut)}.plan li{padding:2px 0}
.plan li b{color:var(--ink);font-variant-numeric:tabular-nums;margin-inline-end:6px}
.meta{font-size:13px;color:var(--mut);margin-top:8px}
.tlx{display:flex;flex-direction:column;gap:14px}
.ti{display:flex;gap:12px;align-items:flex-start}
.ti .t{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--ink);color:var(--app)}
.ti:first-child .t{background:var(--acc);color:#fff}
.ti b{display:block;font-size:17px;line-height:1.25}.ti span{color:var(--mut);font-size:14px;display:block}
.ti a{color:var(--acc);font-weight:700;font-size:14px}
.box{background:var(--soft);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bh{display:flex;justify-content:space-between;font-weight:800;font-size:14px}.bh span{color:var(--mut);font-weight:600}
.bar{display:flex;align-items:center;gap:10px;font-size:14px}.bar .av{width:26px;height:26px;font-size:12px}
.bar .b{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar .b i{display:block;height:100%;background:var(--ink);border-radius:3px}
.bar em{font-style:normal;font-weight:700;width:52px;text-align:end;white-space:nowrap}
.tot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-weight:800}
.rs{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--app);color:var(--ink);width:100%;font-family:inherit;cursor:pointer;text-align:start}
.rs.yes{background:var(--oks);border-color:transparent}.rs.no{background:var(--nos);border-color:transparent}
.rs .nm{flex:1;font-weight:700}.rs .nm small{display:block;font-weight:600;color:var(--mut);font-size:12px}
.st{font-size:13px;font-weight:800;white-space:nowrap;color:var(--mut)}.yes .st{color:var(--ok)}.no .st{color:var(--no)}
.hint{font-size:13px;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:start;border:1px solid var(--line);background:var(--app);color:var(--ink);border-radius:18px;padding:12px;cursor:pointer;font-family:inherit}
.cal{flex:none;width:52px;height:56px;border-radius:14px;background:var(--accs);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.cal b{font-size:20px;color:var(--acc)}.cal small{font-size:11px;font-weight:700;color:var(--mut)}
.card.old .cal{background:var(--soft)}.card.old .cal b{color:var(--mut)}
.ci{flex:1}.ci b{display:block;font-size:16px;line-height:1.2}.ci span{font-size:13px;color:var(--mut)}
.badge{font-size:12px;font-weight:800;white-space:nowrap;color:var(--ok)}
.hero{background:var(--acc);color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero h1{color:#fff}.hero p{margin:0;opacity:.9;font-size:15px}
.hero .cta{background:#fff;color:var(--acc);box-shadow:none}
.hero svg{position:absolute;right:-20px;top:-20px;opacity:.25}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:16px;text-align:center;color:var(--mut);font-size:14px}
.list{display:flex;flex-direction:column;gap:6px}
.list button{text-align:start;border:1px solid var(--line);background:var(--app);color:var(--ink);border-radius:12px;padding:10px 12px;font:600 14px Manrope,sans-serif;cursor:pointer}
.spin{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite;margin:60px auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--app);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9999;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.src{font-size:12px;color:var(--mut)}.src a{color:inherit}
.leaflet-container{font-family:Manrope,sans-serif}
.bell{position:relative;border:0;background:var(--soft);color:var(--ink);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.bell i{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--acc);color:#fff;font:800 11px/20px Manrope,sans-serif;font-style:normal;padding:0 5px;border:2px solid var(--app)}
.bell i:empty{display:none}
.inv{display:flex;gap:12px;align-items:center;width:100%;text-align:start;border:0;background:var(--accs);color:var(--ink);border-radius:18px;padding:14px;cursor:pointer;font-family:inherit;position:relative}
.inv .ic{flex:none;width:44px;height:44px;border-radius:14px;background:var(--acc);display:grid;place-items:center}
.inv b{display:block;font-size:16px;line-height:1.2}.inv span{font-size:13px;color:var(--mut)}
.inv.new::after{content:"";position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;background:var(--acc)}
.invbig{background:var(--acc);color:#fff;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:6px}
.invbig small{opacity:.85;font-weight:700}.invbig b{font-size:28px;line-height:1.1}.invbig p{margin:6px 0 0;font-size:15px;opacity:.95}
.who{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--soft)}
.who .nm{flex:1;font-weight:700}
.chk{display:flex;gap:10px;align-items:center;font-weight:700;font-size:15px;cursor:pointer;padding:6px 0}.chk input{width:22px;height:22px;accent-color:var(--acc)}
.nt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:12px 4px;cursor:pointer;font-family:inherit}
.nt .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px;background:var(--line)}.nt.un .dot{background:var(--acc)}
.nt b{display:block;font-size:15px;line-height:1.3}.nt span{font-size:12px;color:var(--mut)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.fab{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));right:max(16px,calc(50vw - 205px));z-index:900;height:56px;padding:0 20px 0 16px;border:0;border-radius:28px;background:var(--ink);color:var(--app);display:flex;align-items:center;gap:8px;font:800 16px Manrope,sans-serif;box-shadow:0 10px 28px -8px #0007;cursor:pointer}
.fab[hidden]{display:none}
main{padding-bottom:96px}
.sheet{position:fixed;inset:0;z-index:950;background:#0007;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .in{width:100%;max-width:440px;background:var(--app);border-radius:24px 24px 0 0;padding:18px 18px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{margin:0;font-size:18px}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.apps a,.apps button{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font:700 12px Manrope,sans-serif;border:0;background:none;cursor:pointer;padding:0}
.apps span{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:24px}
</style>
</head>
<body>
<div class="phone">
  <header>
    <button class="logo" data-go="home" aria-label="Ana sayfa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><circle cx="5" cy="6" r="2.2"/><circle cx="19" cy="6" r="2.2"/><circle cx="12" cy="20" r="2.2"/><path d="M6.5 7.5 11 12M17.5 7.5 13 12M12 13v5"/><circle cx="12" cy="12" r="1.6" fill="#fff"/></svg></button>
    <div class="brand">Buluşalım</div>

    <button class="bell" id="bell" data-go="notes" aria-label="Bildirimler"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><i id="badge"></i></button>
  </header>
  <main id="m"><div class="note" style="margin-top:20px"><b>Bu sayfa burada çalışmıyor.</b><br>WhatsApp'ın önizlemesi uygulamayı çalıştıramaz. Sana gönderilen <b>linke</b> dokun, Safari'de veya Chrome'da açılsın. Dosya geldiyse gönderen kişiden linki iste.</div></main>
</div>
<button class="fab" id="fab" aria-label="Paylaş"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>Paylaş</button>
<div class="sheet" id="sheet" hidden><div class="in"><h3>Paylaş</h3><div class="apps" id="apps"></div><button class="ghost" id="sclose">Kapat</button></div></div>
<div class="toast" id="toast"></div>
<script>
{
/* ---------- veri ve yardımcılar ---------- */
const LS='bulusalim_v3';
const COL=['#ff4b1f','#2563eb','#d97706','#16a34a','#9333ea','#0891b2','#db2777','#65a30d'];
const FOODS=['Meyhane','Kebap','Esnaf lokantası','Burger','Pizza','Sushi'];
const PRICE={'Meyhane':900,'Kebap':550,'Esnaf lokantası':330,'Burger':450,'Pizza':420,'Sushi':900,'Restoran':500,'Kahve':150,'Tatlı':200,'Bar':450,'Yürüyüş':0};
const SRC='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
let DB={plans:[],draft:null,me:null,inbox:[],sent:[],notes:[],out:[],seen:[]};
try{DB=Object.assign(DB,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){toast('Kaydedilemedi: tarayıcı hafızası kapalı')}};
const nextFri=()=>{const d=new Date();d.setDate(d.getDate()+((5-d.getDay()+7)%7||7));return iso(d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const newDraft=()=>({date:nextFri(),time:'19:30',people:[{n:DB.me?.name||'Sen',id:DB.me?.id},{n:''}],food:['Fark etmez'],drink:'karışık',min:300,max:1000});
let D=DB.draft||newDraft();
const keep=()=>{DB.draft=D;save()};
/* ---------- davetler ve telefonlar arası mesaj (ntfy.sh) ---------- */
const NT='https://ntfy.sh/';
const rid=(n=14)=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>'abcdefghijklmnopqrstuvwxyz0123456789'[b%36]).join('');
const ME=()=>DB.me;
const b64=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const unb64=s=>JSON.parse(decodeURIComponent(escape(atob(s))));
function note(kind,ref,text){DB.notes.unshift({id:rid(8),ts:Date.now(),kind,ref,text,read:false});DB.notes=DB.notes.slice(0,80);save();badge()}
function badge(){const n=DB.notes.filter(x=>!x.read).length;const e=$('badge');if(e)e.textContent=n?String(n):''}
function send(to,body){if(!to||to===ME().id)return;DB.out.push({to,m:{...body,mid:rid(10),from:{id:ME().id,name:ME().name}},ts:Date.now(),last:0});save();flush()}
let flushing=false;
async function flush(){if(flushing||!ME())return;flushing=true;let fail=false;
 for(const o of DB.out){if(Date.now()-o.ts>7*864e5){o.dead=1;continue}if(o.last&&Date.now()-o.last<6*36e5)continue;
  try{const r=await fetch(NT+'blsm-'+o.to,{method:'POST',body:JSON.stringify(o.m)});if(!r.ok)throw 0;o.last=Date.now()}catch(e){fail=true}}
 DB.out=DB.out.filter(o=>!o.dead&&!o.acked);save();flushing=false;
 if(fail)toast('İnternet yok gibi. Bağlanınca otomatik gönderilecek.')}
let polling=false;
async function poll(){if(polling||!ME())return;polling=true;
 try{const r=await fetch(NT+'blsm-'+ME().id+'/json?poll=1&since=all');const txt=await r.text();let ch=false;
  for(const line of txt.split('\n')){if(!line.trim())continue;let ev,m;try{ev=JSON.parse(line);if(ev.event!=='message')continue;m=JSON.parse(ev.message)}catch(e){continue}
   if(m.t!=='ack'){fetch(NT+'blsm-'+m.from?.id,{method:'POST',body:JSON.stringify({t:'ack',ack:m.mid,mid:rid(10),from:{id:ME().id}})}).catch(()=>{})}
   if(DB.seen.includes(m.mid))continue;DB.seen.push(m.mid);DB.seen=DB.seen.slice(-600);handle(m);ch=true}
  save();if(ch&&['home','notes','saved','sentinv','invite'].includes(view))render();badge()}catch(e){}
 polling=false;flush()}
function handle(m){const f=m.from||{};
 if(m.t==='ack'){const o=DB.out.find(o=>o.m.mid===m.ack);if(o)o.acked=1;DB.out=DB.out.filter(o=>!o.acked);return}
 if(m.t==='acc'||m.t==='dec'){const inv=DB.sent.find(x=>x.id===m.inv);if(!inv)return;inv.resp=inv.resp||{};inv.resp[f.id]={name:f.name,v:m.t==='acc'?'yes':'no',loc:m.loc||null,ts:Date.now()};
  note('acc',inv.id,m.t==='acc'?`${f.name} buluşmayı kabul etti! Planlamaya başlayın.`:`${f.name} bu sefer gelemiyor.`);return}
 if(m.t==='plan'){const p=m.p,ex=DB.plans.find(x=>x.id===p.id);const mine=ex?.myVote;
  const P={...p,remote:true,owner:f,myVote:mine};if(mine){const i=P.people.findIndex(q=>q.id===ME().id);if(i>=0)P.rsvp[i]=mine}
  if(ex)Object.assign(ex,P);else{DB.plans.push(P);note('plan',p.id,`${f.name} planı hazırladı: ${p.plan.title}. Geliyor musun?`)}
  const iv=DB.inbox.find(x=>x.id===p.inv);if(iv)iv.planned=p.id;return}
 if(m.t==='rsvp'){const P=DB.plans.find(x=>x.id===m.pid&&!x.remote);if(!P)return;const i=P.people.findIndex(q=>q.id===f.id);if(i<0)return;
  P.rsvp[i]=m.v;P.when=P.when||{};P.when[i]=Date.now();note('rsvp',P.id,`${f.name}: ${m.v==='yes'?'Geliyorum ✅':'Gelemiyorum ❌'} (${P.plan.title})`);sendPlan(P);return}
}
function sendPlan(P){const slim={id:P.id,inv:P.inv,date:P.date,time:P.time,area:P.area,center:P.center,people:P.people,plan:P.plan,rsvp:P.rsvp,done:P.done};P.people.forEach(q=>q.id&&q.id!==ME().id&&send(q.id,{t:'plan',p:slim}))}
function addInvite(inv,silent){if(!inv||inv.t!=='inv'||!ME())return;if(inv.from.id===ME().id)return;if(DB.inbox.some(x=>x.id===inv.id))return;
 DB.inbox.unshift({...inv,st:'new'});note('inv',inv.id,`Bir buluşma isteğiniz var — ${inv.from.name} tarafından`);save()}
function inviteFile(inv){const data=JSON.stringify(inv).replace(/</g,'\\u003c');
 const html=SRC.replace(/<script type="application\/json" id="EMBED">[\s\S]*?<\/script>/,()=>'<script type="application/json" id="EMBED">'+data+'<\/script>');
 return new File([html],`bulusalim-davet-${(inv.from.name||'').toLocaleLowerCase('tr').replace(/[^a-zçğıöşü0-9]+/g,'')||'arkadas'}.html`,{type:'text/html'})}
const inviteLink=inv=>/^https?:/.test(location.protocol)?location.href.split('#')[0]+'#i='+b64(inv):'';
const inviteText=inv=>`${inv.from.name} seni buluşmaya çağırıyor! 📅 ${fdate(inv.date)} ${inv.time}${inv.note?'\n💬 '+inv.note:''}\nDosyayı aç, davet bildirimlerde seni bekliyor 👀`;
function appFile(){const html=SRC.replace(/<script type="application\/json" id="EMBED">[\s\S]*?<\/script>/,()=>'<script type="application/json" id="EMBED">null<\/script>');return new File([html],'bulusalim.html',{type:'text/html'})}
function shareCtx(){
 if(view==='sentinv'){const x=DB.sent.find(v=>v.id===arg);if(x){const{resp,planned,...inv}=x;return{title:'Buluşma daveti',text:inviteText(inv),url:inviteLink(inv),file:inviteFile(inv)}}}
 if(view==='saved'){const P=DB.plans.find(x=>x.id===arg);if(P)return{title:P.plan.title,text:msg(P)}}
 if(view==='invite'){const x=DB.inbox.find(v=>v.id===arg);if(x)return{title:'Buluşma daveti',text:inviteText(x),url:inviteLink(x),file:inviteFile(x)}}
 return{title:'Buluşalım',text:'Arkadaşlarınla buluşmayı planlamak için Buluşalım\'ı kullan: ortak noktayı bulur, gerçek mekanlardan plan çıkarır 🍽️',url:/^https?:/.test(location.protocol)?location.href.split('#')[0]:'',file:appFile()}}
async function doShare(c=shareCtx()){
 const full=c.url?c.text+'\n'+c.url:c.text;
 if(navigator.share){
  try{if(c.file&&!c.url&&navigator.canShare&&navigator.canShare({files:[c.file]})){await navigator.share({files:[c.file],title:c.title,text:c.text});return}
   await navigator.share(c.url?{title:c.title,text:c.text,url:c.url}:{title:c.title,text:c.text});
   if(c.file&&!c.url)setTimeout(()=>toast('Telefonun dosya paylaşmadı; arkadaşına HTML dosyasını ayrıca gönder.'),400);return}
  catch(e){if(e.name==='AbortError')return}}
 openSheet(c,full)}
function openSheet(c,full){const t=encodeURIComponent(full);
 $('apps').innerHTML=[['WhatsApp','#25d366','https://wa.me/?text='+t,'💬'],['Telegram','#229ed9','https://t.me/share/url?url='+encodeURIComponent(c.url||' ')+'&text='+encodeURIComponent(c.text),'✈️'],['Mesajlar','#34c759','sms:?&body='+t,'✉️'],['E-posta','#6b7280','mailto:?subject='+encodeURIComponent(c.title)+'&body='+t,'📧']].map(([n,col,h,ic])=>`<a href="${h}" target="_blank" rel="noopener"><span style="background:${col}">${ic}</span>${n}</a>`).join('')
  +`<button data-scopy="1"><span style="background:var(--ink);color:var(--app)">📋</span>Kopyala</button>`+(c.file?`<button data-sfile="1"><span style="background:var(--acc)">📄</span>Dosyayı indir</button>`:'');
 $('sheet')._c=c;$('sheet')._t=full;$('sheet').hidden=false}
async function shareInvite(inv){const{resp,planned,...x}=inv;await doShare({title:'Buluşma daveti',text:inviteText(x),url:inviteLink(x),file:inviteFile(x)})}
function getPos(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no();navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude}),no,{enableHighAccuracy:true,timeout:15000})})}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const ini=n=>((n||'?').trim()[0]||'?').toLocaleUpperCase('tr');
const av=(n,i)=>`<span class="av" style="background:${COL[i%8]}22;color:${COL[i%8]}">${esc(ini(n))}</span>`;
const nm=(p,i)=>p.n?.trim()||`Kişi ${i+1}`;
const hv=(a,b)=>{const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r;const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const est=km=>Math.round(6+km*3.4);
const addMin=(t,m)=>{let[h,mm]=t.split(':').map(Number);mm+=m;h=(h+Math.floor(mm/60))%24;mm%=60;return`${String(h).padStart(2,'0')}:${String(mm).padStart(2,'0')}`};
const fdate=(d,o={weekday:'long',day:'numeric',month:'long'})=>new Date(d+'T12:00').toLocaleDateString('tr-TR',o);
const isPast=p=>p.done||p.date<iso(new Date());
const r10=x=>Math.round(x/10)*10;
const gm=(lat,lng)=>`https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
const gdir=(lat,lng)=>`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
async function getJSON(url,opt={},ms=15000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{...opt,signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(t)}}

/* ---------- gerçek veri: OSM / Nominatim / OSRM ---------- */
async function geocode(q){return(await getJSON(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=tr&limit=6&accept-language=tr&q=${encodeURIComponent(q)}`)).map(r=>({lat:+r.lat,lng:+r.lon,label:r.display_name.split(',').slice(0,3).join(',')}))}
async function reverse(lat,lng){try{const r=await getJSON(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=16&accept-language=tr&lat=${lat}&lon=${lng}`);const a=r.address||{};return[a.neighbourhood||a.suburb||a.quarter||a.road,a.town||a.city_district||a.county||a.city].filter(Boolean).join(', ')||'Orta nokta'}catch(e){return'Orta nokta'}}
async function venues(c){
 for(const R of[1200,2500,4500]){
  const q=`[out:json][timeout:25];(nwr["amenity"~"^(restaurant|fast_food|cafe|bar|pub|ice_cream)$"]["name"](around:${R},${c.lat},${c.lng});nwr["shop"~"^(pastry|confectionery)$"]["name"](around:${R},${c.lat},${c.lng}););out center tags 400;`;
  let js=null;
  for(const ep of['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter']){try{js=await getJSON(ep,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}},30000);break}catch(e){}}
  if(!js)throw new Error('overpass');
  const seen=new Set(),out=[];
  for(const e of js.elements){const t=e.tags||{},lat=e.lat??e.center?.lat,lng=e.lon??e.center?.lon;if(lat==null||seen.has(t.name))continue;seen.add(t.name);
   const v={name:t.name,lat,lng,addr:[t['addr:street'],t['addr:housenumber']].filter(Boolean).join(' '),cats:cats(t)};v.d=hv(c,v);if(v.cats.length)out.push(v)}
  if(out.filter(v=>v.cats.includes('Restoran')).length>=6||R===4500)return out.sort((a,b)=>a.d-b.d);
 }}
function cats(t){const c=(t.cuisine||'').toLowerCase(),n=(t.name||'').toLocaleLowerCase('tr'),a=t.amenity,s=c+' '+n,o=[];
 const food=a==='restaurant'||a==='fast_food';
 if(food){o.push('Restoran');
  if(/meyhane/.test(s)||(a==='restaurant'&&/fish|seafood|balık/.test(s)))o.push('Meyhane');
  if(/burger/.test(s))o.push('Burger');if(/pizza/.test(s))o.push('Pizza');if(/sushi|japanese|japon/.test(s))o.push('Sushi');
  if(/kebab|kebap|ocakbaşı|döner|doner|lahmacun|adana|urfa/.test(s))o.push('Kebap');
  if(/lokanta|esnaf|ev yemek|homemade|regional|home_made/.test(s)||(a==='restaurant'&&/turkish/.test(c)&&!/kebab/.test(c)))o.push('Esnaf lokantası')}
 if(a==='cafe'||/coffee|kahve/.test(s))o.push('Kahve');
 if(t.shop||a==='ice_cream'||/dessert|baklava|künefe|kunefe|pastane|tatlı|dondurma|ice_cream|patisserie|pasta/.test(s))o.push('Tatlı');
 if(a==='bar'||a==='pub')o.push('Bar');
 return o}
async function travel(people,dests){
 const est2=()=>dests.map(d=>people.map(p=>est(hv(p,d))));
 try{const co=[...people,...dests].map(p=>`${p.lng.toFixed(5)},${p.lat.toFixed(5)}`).join(';');
  const js=await getJSON(`https://router.project-osrm.org/table/v1/driving/${co}?sources=${people.map((_,i)=>i).join(';')}&destinations=${dests.map((_,i)=>i+people.length).join(';')}`,{},12000);
  return dests.map((d,j)=>people.map((p,i)=>{const s=js.durations?.[i]?.[j];return s==null?est(hv(p,d)):Math.round(s/60*1.3+4)}))}catch(e){return est2()}}
function middle(ps){
 let c={lat:ps.reduce((a,p)=>a+p.lat,0)/ps.length,lng:ps.reduce((a,p)=>a+p.lng,0)/ps.length};
 const f=q=>{const d=ps.map(p=>hv(p,q));return Math.max(...d)+.3*d.reduce((a,b)=>a+b,0)/d.length};
 let span=Math.max(...ps.map(p=>Math.abs(p.lat-c.lat)),...ps.map(p=>Math.abs(p.lng-c.lng)),.01);
 for(let r=0;r<4;r++){let best=c,bv=f(c);for(let i=-6;i<=6;i++)for(let j=-6;j<=6;j++){const q={lat:c.lat+i*span/6,lng:c.lng+j*span/6},v=f(q);if(v<bv){bv=v;best=q}}c=best;span/=3}
 return c}

/* ---------- plan üretimi ---------- */
function buildPlans(){
 const V=D.venues||[],c=D.center;
 let foods=D.food.includes('Fark etmez')?[...FOODS]:D.food.filter(f=>FOODS.includes(f));
 if(D.drink==='içmiyoruz')foods=foods.filter(f=>f!=='Meyhane');
 const fit=f=>{const x=PRICE[f]+(D.drink==='iç'&&f!=='Meyhane'?150:0);return x>=D.min-150&&x<=D.max};
 foods.sort((a,b)=>(fit(b)-fit(a))||(foods.indexOf(a)-foods.indexOf(b)));
 const has=f=>V.some(v=>v.cats.includes(f));
 let order=foods.filter(has);if(!order.length)order=['Restoran'];
 const afters=['Kahve','Tatlı',...(D.drink!=='içmiyoruz'?['Bar']:[]),'Yürüyüş'];
 const used=new Set(),out=[];
 for(let k=0;k<3;k++){
  let f=null,r=null;
  for(let s=0;s<order.length&&!r;s++){const ff=order[(k+s)%order.length];r=V.find(v=>v.cats.includes(ff)&&!used.has(v.name));if(r)f=ff}
  if(!r){r=V.find(v=>v.cats.includes('Restoran')&&!used.has(v.name));f='Restoran'}
  if(!r)break;used.add(r.name);
  let a=null,at=null;
  for(let s=0;s<afters.length&&!a;s++){at=afters[(k+s)%afters.length];if(at==='Yürüyüş'){a={name:'Yürüyüş',lat:r.lat,lng:r.lng,walk:1};break}
   const cand=V.filter(v=>v.cats.includes(at)&&!used.has(v.name)&&v.name!==r.name).map(v=>({...v,dr:hv(r,v)})).filter(v=>v.dr<1.2).sort((x,y)=>x.dr-y.dr)[0];if(cand){a=cand;used.add(cand.name)}}
  let cost=PRICE[f]+(PRICE[at]||0);if(D.drink==='iç'&&f!=='Meyhane'&&at!=='Bar')cost+=150;cost=r10(cost);
  out.push({food:f,rest:{name:r.name,lat:r.lat,lng:r.lng,addr:r.addr},after:{type:at,name:a.name,lat:a.lat,lng:a.lng,walk:a.walk?0:Math.max(1,Math.round(hv(r,a)*1000/75))},cost,title:`${f==='Restoran'?'Akşam yemeği':f} + ${at.toLocaleLowerCase('tr')}`});
 }
 const rest=out.slice(1).sort((x,y)=>x.cost-y.cost);
 out.forEach((p,i)=>p.tag=i===0?'En çok uyan':p===rest[0]&&p.cost<out[0].cost?'Daha ucuz':'Farklı bir şey');
 return out}

/* ---------- harita ---------- */
let MAP=null;
function drawMap(id,people,extra=[],onTap){
 if(MAP){MAP.remove();MAP=null}
 const el=$(id);if(!el)return;
 if(!window.L){el.textContent='Harita yüklenemedi (internet gerekli)';return}
 el.textContent='';MAP=L.map(el,{zoomControl:false,attributionControl:true});
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP);
 const pts=[];
 people.forEach((p,i)=>{if(p.lat==null)return;pts.push([p.lat,p.lng]);L.marker([p.lat,p.lng],{icon:L.divIcon({className:'',html:`<div class="pin" style="background:${COL[i%8]}">${esc(ini(p.n))}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(MAP);
  if(extra[0])L.polyline([[p.lat,p.lng],[extra[0].lat,extra[0].lng]],{color:COL[i%8],weight:3,dashArray:'6 6',opacity:.8}).addTo(MAP)});
 extra.forEach((x,k)=>{pts.push([x.lat,x.lng]);L.marker([x.lat,x.lng],{icon:L.divIcon({className:'',html:`<div class="pin big" ${k?'style="background:#141316;width:30px;height:30px;font-size:13px"':''}>${x.icon||'★'}</div>`,iconSize:k?[30,30]:[38,38],iconAnchor:k?[15,15]:[19,19]})}).addTo(MAP).bindPopup(esc(x.name||''))});
 if(pts.length>1)MAP.fitBounds(pts,{padding:[36,36]});else MAP.setView(pts[0]||[39.92,32.85],pts.length?15:11);
 if(onTap)MAP.on('click',e=>onTap(e.latlng));
 setTimeout(()=>MAP&&MAP.invalidateSize(),60);
}

/* ---------- ekranlar ---------- */
let view='home',arg=null,hist=[];
function go(v,a=null,push=true){if(push&&view!=='loading')hist.push([view,arg]);view=v;arg=a;render()}
$('back').onclick=()=>{const h=hist.pop();if(h){view=h[0];arg=h[1];render()}else go('home',null,false)};

const ICON='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

 <div class="ti"><div class="t">${addMin(P.time,120)}</div><div><b>Sonrası: ${esc(p.after.type)}</b><span>${p.after.walk===0?'Mekanın çevresinde':esc(p.after.name)+' · '+p.after.walk+' dk yürüme'}</span>${p.after.walk===0?'':`<a href="${gm(p.after.lat,p.after.lng)}" target="_blank" rel="noopener">Haritada gör ›</a>`}</div></div></div>

 <div class="tot"><span>Kişi başı tahmini hesap</span><span>~${p.cost} TL</span></div></div>`}
const msg=P=>`🍽️ ${fdate(P.date)} ${P.time} — ${P.plan.title}\n📍 ${P.plan.rest.name} (${P.area})\n${gm(P.plan.rest.lat,P.plan.rest.lng)}\n➡️ Sonrası: ${P.plan.after.name}\n💸 Kişi başı ~${P.plan.cost} TL\nGeliyor musunuz? 👀`;

function render(){
 if(!ME())view='setup';const m=$('m');if(MAP&&view!=='loc'){MAP.remove();MAP=null}
 m.innerHTML=VIEWS[view]();m.style.animation='none';m.offsetHeight;m.style.animation='';
 $('back').hidden=['home','loading','setup'].includes(view);$('bell').hidden=view==='setup';$('fab').hidden=['setup','loading','loc'].includes(view);$('sheet').hidden=true;badge();window.scrollTo(0,0);
 if(view==='loc'){const p=D.people[arg];drawMap('lm',p.lat!=null?[p]:[],[],ll=>setLoc(arg,ll.lat,ll.lng));if(p.lat==null&&MAP){const o=D.people.find(q=>q.lat!=null);MAP.setView(o?[o.lat,o.lng]:[39.92,32.85],o?13:11)}}
 if(view==='mid')drawMap('mm',D.people,[{...D.center,name:D.area}]);
 if(view==='detail'){const p=D.plans[arg];drawMap('pm',D.people,[{...p.rest,icon:'🍽'},...(p.after.walk?[{...p.after,icon:'☕'}]:[])])}
 if(view==='saved'){const P=DB.plans.find(x=>x.id===arg);if(P)drawMap('pm',P.people,[{...P.plan.rest,icon:'🍽'},...(P.plan.after.walk?[{...P.plan.after,icon:'☕'}]:[])])}
}
async function setLoc(i,lat,lng,label){const p=D.people[i];p.lat=lat;p.lng=lng;p.label=label||'İşaretlenen konum';keep();render();if(!label){p.label=await reverse(lat,lng);keep();const b=document.querySelector(`[data-loc="${i}"]`);if(b)b.textContent='📍 '+p.label}}

/* ---------- olaylar ---------- */
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.go){if(d.go==='home'){hist=[];location.hash&&history.replaceState(null,'',location.pathname+location.search)}go(d.go,null,d.go!=='home');return}
 if(d.new){D=newDraft();keep();go('people');return}
 if(d.add){D.people.push({n:''});keep();render();return}
 if(d.rm){D.people.splice(+d.rm,1);keep();render();return}
 if(d.loc){go('loc',+d.loc);return}
 if(d.locok){$('back').click();return}
 if(d.gps){if(!navigator.geolocation){toast('Bu tarayıcı konum vermiyor');return}b.textContent='Konum alınıyor…';
  navigator.geolocation.getCurrentPosition(p=>setLoc(+d.gps,p.coords.latitude,p.coords.longitude).then(()=>toast(`Konum alındı (±${Math.round(p.coords.accuracy)} m)`)),err=>{b.textContent='📍 Şu anki konumumu kullan';toast(err.code===1?'Konum izni verilmedi':'Konum alınamadı')},{enableHighAccuracy:true,timeout:15000});return}
 if(d.search){const q=$('q').value.trim();if(!q)return;const r=$('results');r.innerHTML='<p class="hint">Aranıyor…</p>';
  try{const rs=await geocode(q);r.innerHTML=rs.length?rs.map((x,k)=>`<button data-pick="${k}">${esc(x.label)}</button>`).join(''):'<p class="hint">Sonuç yok. Haritada dokunarak seç.</p>';r._rs=rs}catch(err){r.innerHTML='<p class="hint">Arama yapılamadı (internet?). Haritada dokunarak seç.</p>'}return}
 if(d.pick){const x=$('results')._rs[+d.pick];setLoc(arg,x.lat,x.lng,x.label);return}
 if(d.mid){loading('Ortak nokta hesaplanıyor…');D.center=middle(D.people);const[a,t]=await Promise.all([reverse(D.center.lat,D.center.lng),travel(D.people,[D.center])]);D.area=a;D.ctimes=t[0];keep();go('mid',null,false);return}
 if(d.food){const f=d.food;if(f==='Fark etmez')D.food=['Fark etmez'];else{D.food=D.food.filter(x=>x!=='Fark etmez');D.food=D.food.includes(f)?D.food.filter(x=>x!==f):[...D.food,f];if(!D.food.length)D.food=['Fark etmez']}keep();render();return}
 if(d.drink){D.drink=d.drink;keep();render();return}
 if(d.find){loading('Çevredeki gerçek mekanlar aranıyor…');
  try{D.venues=await venues(D.center)}catch(err){go('prefs',null,false);toast('Mekan verisine ulaşılamadı, biraz sonra tekrar dene');return}
  D.plans=buildPlans();if(D.plans.length){const T=await travel(D.people,D.plans.map(p=>p.rest));D.plans.forEach((p,i)=>p.times=T[i])}
  keep();go('plans',null,false);return}
 if(d.plan){go('detail',+d.plan);return}
 if(d.save){const p=D.plans[+d.save];const P={id:Date.now().toString(36),created:Date.now(),date:D.date,time:D.time,area:D.area,center:D.center,people:D.people.map(q=>({n:q.n,id:q.id||null,lat:q.lat,lng:q.lng,label:q.label})),plan:p,rsvp:{0:'yes'},when:{0:Date.now()},done:false,inv:D.inv||null,owner:{id:ME().id,name:ME().name}};const iv=DB.sent.find(x=>x.id===D.inv);if(iv)iv.planned=P.id;sendPlan(P);
  DB.plans.push(P);DB.draft=null;D=newDraft();save();hist=[['home',null]];go('saved',P.id,false);toast('Plan kaydedildi');return}
 if(d.open){go('saved',d.open);return}
 const P=view==='saved'&&DB.plans.find(x=>x.id===arg);
 if(d.rs&&P&&!P.remote){const i=+d.rs,s=P.rsvp[i]||'wait';P.rsvp[i]=s==='wait'?'yes':s==='yes'?'no':'wait';P.when=P.when||{};P.when[i]=Date.now();save();if(!P.remote)sendPlan(P);render();return}
 if(d.copy&&P){try{await navigator.clipboard.writeText(msg(P));toast('Plan mesajı kopyalandı')}catch(err){toast('Kopyalanamadı')}return}
 if(d.done&&P){P.done=true;save();if(!P.remote)sendPlan(P);render();toast('Geçmiş buluşmalara taşındı');return}
 if(d.undone&&P){P.done=false;save();render();return}
 if(d.del&&P){if(b.dataset.sure){DB.plans=DB.plans.filter(x=>x!==P);save();hist=[];go('home',null,false);toast('Plan silindi')}else{b.dataset.sure=1;b.textContent='Emin misin? Tekrar dokun'}return}
 if(d.vote&&P&&P.remote){const i=P.people.findIndex(q=>q.id===ME().id);if(i>=0){P.rsvp[i]=d.vote;P.when=P.when||{};P.when[i]=Date.now()}P.myVote=d.vote;save();send(P.owner.id,{t:'rsvp',pid:P.id,v:d.vote});render();toast(`${P.owner.name}'a haber verildi`);return}
 if(d.setname){const v=$('myname').value.trim();if(!v){toast('Adını yaz');return}const first=!DB.me;DB.me={id:DB.me?.id||rid(),name:v};if(D.people[0]&&(!D.people[0].id||D.people[0].id===DB.me.id)){D.people[0].n=v;D.people[0].id=DB.me.id}save();
  if(first){view='home';hist=[];boot();return}go('home',null,false);return}
 if(d.rename){go('setup');return}
 if(d.mkinv){const inv={t:'inv',id:rid(10),from:{id:ME().id,name:ME().name},date:$('idate').value||nextFri(),time:$('itime').value||'19:30',note:$('inote').value.trim(),ts:Date.now()};
  DB.sent.unshift({...inv,resp:{}});save();hist=[['home',null]];go('sentinv',inv.id,false);shareInvite(inv);return}
 if(d.reshare){const x=DB.sent.find(v=>v.id===d.reshare);const{resp,planned,...inv}=x;shareInvite(inv);return}
 if(d.check){toast('Yenileniyor…');await poll();render();return}
 if(d.delinv){if(b.dataset.sure){DB.sent=DB.sent.filter(x=>x.id!==d.delinv);save();hist=[];go('home',null,false)}else{b.dataset.sure=1;b.textContent='Emin misin? Tekrar dokun'}return}
 if(d.sent){go('sentinv',d.sent);return}
 if(d.inv){const x=DB.inbox.find(v=>v.id===d.inv);DB.notes.forEach(n=>{if(n.ref===d.inv)n.read=true});save();go('invite',d.inv);return}
 if(d.accept||d.decline){const x=DB.inbox.find(v=>v.id===(d.accept||d.decline));let loc=null;
  if(d.accept&&$('shareloc')?.checked){b.textContent='Konum alınıyor…';try{loc=await getPos();loc={lat:+loc.lat.toFixed(5),lng:+loc.lng.toFixed(5)}}catch(e){toast('Konum alınamadı, konumsuz gönderiliyor')}}
  x.st=d.accept?'yes':'no';save();send(x.from.id,{t:d.accept?'acc':'dec',inv:x.id,loc});render();toast(d.accept?`Kabul edildi! ${x.from.name}'a bildirim gitti.`:`${x.from.name}'a haber verildi`);return}
 if(d.change){const x=DB.inbox.find(v=>v.id===d.change);x.st='new';save();render();return}
 if(d.startplan){const x=DB.sent.find(v=>v.id===d.startplan);D=newDraft();D.date=x.date;D.time=x.time;D.inv=x.id;
  D.people=[{n:ME().name,id:ME().id},...Object.entries(x.resp||{}).filter(([,q])=>q.v==='yes').map(([id,q])=>q.loc?{n:q.name,id,lat:q.loc.lat,lng:q.loc.lng,label:'Paylaştığı konum'}:{n:q.name,id})];
  keep();go('people');return}
 if(d.note){const n=DB.notes.find(v=>v.id===d.note);n.read=true;save();
  if(n.kind==='inv')go('invite',n.ref);else if(n.kind==='acc')go('sentinv',n.ref);else if(DB.plans.some(p=>p.id===n.ref))go('saved',n.ref);else render();return}
 if(d.readall){DB.notes.forEach(n=>n.read=true);save();render();return}
});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
 if(d.n!==undefined){D.people[+d.n].n=t.value;keep();t.closest('.person').querySelector('.av').textContent=ini(t.value||'?')}
 if(t.id==='mn'||t.id==='mx'){let a=+$('mn').value,b=+$('mx').value;if(a>b-100){if(t.id==='mn')a=b-100;else b=a+100}D.min=Math.max(0,a);D.max=Math.min(2000,b);$('mn').value=D.min;$('mx').value=D.max;$('bt').textContent=`${D.min} – ${D.max} TL`;$('tr').style.left=D.min/20+'%';$('tr').style.right=(100-D.max/20)+'%';keep()}
 if(t.id==='time'&&t.value){D.time=t.value;keep()}
 if(t.id==='date'&&t.value){D.date=t.value;keep()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();document.querySelector('[data-search]').click()}});

/* ---------- açılış ---------- */
$('fab').onclick=()=>doShare();
$('sclose').onclick=()=>$('sheet').hidden=true;
$('sheet').addEventListener('click',async e=>{if(e.target.id==='sheet'){$('sheet').hidden=true;return}
 const b=e.target.closest('button,a');if(!b)return;
 if(b.dataset.scopy){try{await navigator.clipboard.writeText($('sheet')._t);toast('Kopyalandı')}catch(err){toast('Kopyalanamadı')}return}
 if(b.dataset.sfile){const f=$('sheet')._c.file,a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();a.remove();toast('Dosya indirildi');return}
 if(b.tagName==='A')setTimeout(()=>$('sheet').hidden=true,300)});

let EMB=null;try{EMB=JSON.parse($('EMBED').textContent)}catch(e){}
function boot(){
 let inv=EMB;if(location.hash.startsWith('#i=')){try{inv=unb64(location.hash.slice(3))}catch(e){}history.replaceState(null,'',location.pathname+location.search)}
 if(inv&&inv.t==='inv'&&ME()){addInvite(inv);if(inv.from.id!==ME().id&&DB.inbox.find(x=>x.id===inv.id)?.st==='new'){hist=[['home',null]];view='invite';arg=inv.id;DB.notes.forEach(n=>{if(n.ref===inv.id)n.read=true});save()}}
 render();poll();
}
setInterval(()=>{if(document.visibilityState==='visible')poll()},15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')poll()});
window.addEventListener('online',()=>{flush();poll()});
boot();
}
</script>
</body>
